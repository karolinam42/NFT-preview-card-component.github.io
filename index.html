<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" type="text/css" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

<body>
  <main>
    <div class="card">
      <div class="image-wrapper">
        <img src="images/image-equilibrium.jpg" alt="an image of a cube" class="big-image">
        <div class="hovered-image">
          <img src="images/icon-view.svg">
        </div>
      </div>
      <h1>Equilibrium #3429</h1>

      <p class="details">Our Equilibrium collection promotes balance and calm.</p>
      <div class="down">
        <div class="price">
          <img src="images/icon-ethereum.svg" alt="ethereum icon" class="icon">
          <p>0.041 ETH</p>
        </div>
        <div class="time">
          <img src="images/icon-clock.svg" alt="clock icon" class="icon">
          <p>3 days left</p>
        </div>
      </div>
      <div class="line"></div>
      <div class="attr">
        <img src="images/image-avatar.png" alt="avatar picture" class="pfp">
        <p>Creation of <span class="username">Jules Wyvern</span></p>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/karolinam42">Karolina M</a>.
  </footer>
</body>

</html>
